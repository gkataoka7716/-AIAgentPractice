services:
  agent:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: skillgenerator-agent
    working_dir: /app
    volumes:
      - ./agent:/app
    depends_on:
      - ollama
    environment:
      OLLAMA_BASE_URL: http://ollama:11434
    stdin_open: true
    tty: true

  ollama:
    image: ollama/ollama:latest
    container_name: skillgenerator-ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    restart: unless-stopped

volumes:
  ollama_data: